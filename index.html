<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b5c">
<meta name="robots" content="noindex">
<title>Buchhaltungs-Software</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3b5c'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h20' stroke='%23f2b134' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
/* Buchhaltungs-Software – Oberfläche im Stil klassischer Buchhaltungssoftware */
:root{--blau:#1f3b5c;--blau2:#2d5580;--akz:#0b63c5;--grau:#e9edf2;--grau2:#d5dbe3;--rand:#b9c3cf;--txt:#1b2430;--mut:#5a6675;--ok:#1e7b34;--okbg:#e7f5ea;--bad:#b3261e;--badbg:#fdecea;--info:#0b4f8a;--infobg:#e8f1fb;--soll:#0b4f8a;--haben:#8a3b0b;--sel:#fff6cc}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:#c9d1db;display:flex;flex-direction:column;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f5a623;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;vertical-align:middle}
/* Titelleiste */
.titlebar{background:linear-gradient(#25476e,var(--blau));color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;flex:none}
.titlebar .app{font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.titlebar .appic{width:22px;height:22px;border-radius:4px;background:#f2b134;color:var(--blau);display:grid;place-items:center;font-weight:800;font-size:13px}
.titlebar .mand{opacity:.85;font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menubtn{display:none;background:none;border:0;color:#fff;width:44px;height:40px;margin-left:-8px}
#mtitle{display:none;font-weight:600}
/* Menüleiste */
#menubar{background:#f4f6f9;border-bottom:1px solid var(--rand);display:flex;padding:0 6px;flex:none;position:relative;z-index:30}
.mb{position:relative}
.mbtn{background:none;border:0;padding:6px 12px;min-height:32px;border-radius:3px}
.mbtn:hover,.mb.open .mbtn{background:#dfe6ef}
.mdrop{display:none;position:absolute;left:0;top:100%;min-width:260px;background:#fff;border:1px solid var(--rand);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px 0}
.mb.open .mdrop{display:block}
.mdrop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;min-height:40px}
.mdrop button:hover,.mdrop button:focus{background:var(--infobg)}
/* Symbolleiste */
#toolbar{background:linear-gradient(#fbfcfd,#eceff3);border-bottom:1px solid var(--rand);display:flex;gap:2px;padding:4px 6px;flex:none;overflow-x:auto}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:1px solid transparent;border-radius:4px;padding:4px 8px;min-width:64px;min-height:48px;font-size:12px;color:#26384d}
.tb:hover{background:#e3eaf3;border-color:#c4d0de}
.tb.akt{background:#d6e4f5;border-color:#9fb8d6}
.tsep{width:1px;background:var(--rand);margin:4px 6px}
/* Arbeitsbereich */
.work{flex:1;display:flex;min-height:0}
#nav{width:228px;flex:none;background:#eef1f5;border-right:1px solid var(--rand);overflow-y:auto;padding:8px 0}
.navgrp{margin-bottom:8px}
.navh{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:6px 14px 3px;font-weight:600}
.navi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-left:3px solid transparent;padding:9px 12px;min-height:44px;text-align:left;color:#1f2d3d}
.navi:hover{background:#e0e7f0}
.navi.akt{background:#fff;border-left-color:var(--akz);font-weight:600;color:var(--blau)}
.navi .badge{margin-left:auto;font-size:12px;background:var(--blau2);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.navi.tour-hl{background:#fff3c4;border-left-color:#f2b134;box-shadow:inset 0 0 0 2px #f2b134}
#main{flex:1;overflow:auto;padding:12px;min-width:0}
#drawerbg{display:none}
/* Statusleiste */
#statusbar{background:#dfe4ea;border-top:1px solid var(--rand);display:flex;gap:4px;align-items:center;font-size:12.5px;padding:3px 8px;flex:none;flex-wrap:wrap}
.sb-item{padding:2px 10px;border-right:1px solid var(--rand);display:inline-flex;align-items:center;gap:6px}
.sb-r{margin-left:auto;border:0}
.bar{display:inline-block;width:90px;height:8px;background:#fff;border:1px solid var(--rand);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.lg{width:100%;height:12px;border-radius:6px;margin:6px 0}
.serie-sb{color:#b4690e;font-weight:600}.serie-sb svg{width:16px;height:16px}
/* Fenster */
.win{background:#fff;border:1px solid #9fadbd;border-radius:4px;box-shadow:0 2px 6px rgba(20,40,70,.12);margin-bottom:12px;min-width:0}
.wtitle{display:flex;align-items:center;gap:10px;background:linear-gradient(#e9eff6,#d7e1ec);border-bottom:1px solid #a9b8c9;padding:5px 10px;border-radius:4px 4px 0 0;min-height:36px}
.wtitle h1{font-size:15px;margin:0;display:flex;align-items:center;gap:7px;color:var(--blau)}
.wpath{margin-left:auto;font-size:12px;color:var(--mut)}
.wbody{padding:12px 14px}
.tbtn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--rand);border-radius:4px;padding:4px 10px;min-height:34px;min-width:34px;font-size:13px}
.erkl{background:#f5f8fb;border:1px solid #dbe3ec;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.erkl p{margin:0 0 4px}
.erkl details summary{cursor:pointer;color:var(--akz);padding:6px 0;min-height:32px}
.erkl ul{margin:4px 0 4px 18px;padding:0}.erkl li{margin:3px 0}
.ht{color:var(--mut)}
.hl{white-space:nowrap}
.q{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid #7f9bbd;background:#eef4fb;color:var(--akz);font-weight:700;font-size:12.5px;padding:0;margin-left:4px;vertical-align:middle;position:relative}
.q::after{content:"";position:absolute;inset:-8px}
.mut{color:var(--mut)}.small{font-size:13px}.nowrap{white-space:nowrap}
.note{background:#fff8e1;border:1px solid #f0d58a;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.sec{font-size:15px;color:var(--blau);margin:16px 0 8px;border-bottom:1px solid var(--grau2);padding-bottom:4px}
.linkbtn{background:none;border:0;color:var(--akz);text-decoration:underline;padding:6px 2px;min-height:32px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;background:linear-gradient(#fff,#eef1f5);border:1px solid #9aa9ba;border-radius:4px;padding:8px 16px;min-height:44px;font-weight:500}
.btn:hover{background:#e6edf5}
.btn.primary{background:linear-gradient(#2f6fb9,#1f569a);border-color:#1a4a85;color:#fff;font-weight:600}
.btn.primary:hover{background:#1f569a}
.btn.big{min-width:160px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filter{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.filter input{flex:1;max-width:420px;min-height:40px;border:1px solid #9aa9ba;border-radius:3px;padding:6px 10px}
.tag{display:inline-block;font-size:11.5px;background:#eef1f5;border:1px solid var(--grau2);border-radius:3px;padding:0 6px;color:var(--mut);font-weight:400}
/* Tabellen */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rand)}
table.grid{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.grid th{background:#e4eaf1;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--rand);border-right:1px solid #cfd8e2;white-space:nowrap;position:sticky;top:0}
.grid td{padding:5px 8px;border-bottom:1px solid #e3e8ee;border-right:1px solid #eef1f4;vertical-align:top}
.grid tbody tr:nth-child(even){background:#f7f9fb}
.grid tbody tr:hover{background:#eaf2fc}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}
.grid tfoot td{background:#e9eef4;font-weight:600;border-top:2px solid var(--rand)}
.grid tr.neu{background:#fff4c2!important}
.grid tr.sammel{color:var(--mut);font-style:italic}
.grid td.soll,.grid .soll{color:var(--soll)}.grid td.haben{color:var(--haben)}
.grid .txt{min-width:180px}
.kl-link{background:none;border:0;padding:2px 0;color:var(--akz);text-decoration:underline dotted;font-variant-numeric:tabular-nums;min-height:28px}
.kv{border-collapse:collapse;width:100%}.kv th{text-align:left;color:var(--mut);font-weight:500;padding:4px 10px 4px 0;vertical-align:top;white-space:nowrap}.kv td{padding:4px 0}
/* Übersicht */
.hero{background:linear-gradient(135deg,#eaf2fb,#f8fbff);border:1px solid #c9daee;border-radius:6px;padding:12px 16px;margin-bottom:12px}
.hero .wir{font-size:17px;margin:0 0 4px}.hero p{margin:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--grau2);border-radius:6px;padding:12px 14px;background:#fff}
.card h2{font-size:15px;margin:0 0 6px;color:var(--blau)}
.card .big{font-size:20px;font-weight:600;margin:0}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.modcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--grau2);border-radius:6px;padding:12px;min-height:64px}
.modcard:hover{border-color:var(--akz);background:#f5f9ff}
.modcard .ic{color:var(--blau2);margin-top:2px}
.modcard b{display:block;color:var(--blau)}.modcard small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
/* Saldenliste, OP, UVA */
.opsummen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opsummen div{border:1px solid var(--grau2);border-radius:6px;padding:10px 14px;background:#f7f9fb}
.opsummen span{display:block;color:var(--mut);font-size:13px}.opsummen b{font-size:19px}
.opk{border:1px solid var(--rand);border-radius:4px;margin-bottom:10px;overflow:hidden}
.oph{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;background:#eef2f7;padding:6px 10px}
.opk .tscroll{border:0}
.st{display:inline-block;border-radius:10px;padding:0 8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}.st.offen{background:#fff1d6;color:#8a5300}
.uvakopf{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.uvatab tr.tot td{font-weight:700;background:#eef4fb}
.formel{display:flex;align-items:stretch;gap:8px;margin:14px 0;flex-wrap:wrap}
.fz{border:1px solid var(--grau2);border-radius:6px;padding:8px 14px;background:#f7f9fb;min-width:150px}
.fz span{display:block;font-size:13px;color:var(--mut)}.fz b{font-size:19px}
.fz.op{border:0;background:none;min-width:0;font-size:24px;display:flex;align-items:center;padding:0 2px}
.fz.erg{background:var(--infobg);border-color:#9cc1e8}
/* Glossar */
.glossar{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.glossar div{border:1px solid var(--grau2);border-radius:4px;padding:8px 12px}
.glossar dt{font-weight:600;color:var(--blau)}.glossar dd{margin:2px 0 0}
/* Lernaufgaben */
.aufg{border:1px solid var(--grau2);border-radius:6px;padding:12px;margin-bottom:10px}
.aufgk{display:flex;gap:10px}
.anr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blau2);color:#fff;display:grid;place-items:center;font-weight:700}
.frage{margin:2px 0 0;font-weight:500}
.aein{display:flex;gap:8px;margin:8px 0 0 38px;flex-wrap:wrap}
.aein input{flex:1;min-width:160px;max-width:300px;min-height:44px;border:1px solid #9aa9ba;border-radius:3px;padding:6px 10px;font-size:16px}
.afb{margin-left:38px}
/* Belegerfassung */
.stapel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid #9fadbd;border-radius:4px;padding:6px 8px;margin-bottom:10px}
.stl{font-size:13px;color:var(--mut);margin-right:4px}
.chip{border:1px solid var(--rand);background:#f4f6f9;border-radius:14px;padding:4px 12px;min-height:36px;font-size:13.5px;white-space:nowrap}
.chip.ok{background:var(--okbg);border-color:#9ccfa8;color:var(--ok)}
.chip.jetzt{background:#fff3c4;border-color:#e2b93b;font-weight:700}
.chip.zu{color:#8592a3}
.chip.sel{box-shadow:0 0 0 2px var(--akz)}
.erf{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;align-items:start}
.bwin .wbody{padding:8px}
.zoomhint{font-size:12.5px;color:var(--mut);text-align:center}
.bkopf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.kf{display:flex;flex-direction:column;gap:2px}
.kfl,.ml{font-size:12.5px;color:var(--mut);display:flex;align-items:center;white-space:nowrap}
.kf output{border:1px solid #c5ced9;background:#f1f4f7;border-radius:3px;padding:6px 8px;min-height:36px;font-weight:600}
.gfall{background:#f5f8fb;border:1px solid #dbe3ec;border-radius:4px;padding:8px 12px;margin-bottom:10px}
.konv{margin:6px 0 8px 18px;padding:0}.konv li{margin:3px 0}
.maske{border:1px solid #9fadbd;border-radius:4px;background:#f3f6f9;padding:8px}
.mhead{display:grid;grid-template-columns:28px 1.4fr 1.4fr 1fr 74px 52px 1.3fr .9fr 36px;gap:6px;font-size:12.5px;color:var(--mut);padding:0 4px 4px}
.mhead span{display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.bz{display:grid;grid-template-columns:28px 1.4fr 1.4fr 1fr 74px 52px 1.3fr .9fr 36px;gap:6px;align-items:center;background:#fff;border:1px solid #d3dbe5;border-radius:4px;padding:5px 4px;margin-bottom:5px}
.bz .ml{display:none}
.bz.okz{border-color:#7cc08d;background:#f2fbf4}.bz.badz{border-color:#e08b84;background:#fff6f5}
.zn{font-weight:700;color:var(--mut);text-align:center}
.fld{min-width:0}
.bz input,.bz select,.kbtn{width:100%;min-height:40px;border:1px solid #9aa9ba;border-radius:3px;background:#fff;padding:4px 7px}
.bz input.betrag{text-align:right;font-variant-numeric:tabular-nums}
.bz input:focus,.bz select:focus,.kbtn:focus{background:var(--sel)}
.kbtn{display:flex;align-items:center;gap:6px;text-align:left;overflow:hidden}
.kbtn b{font-variant-numeric:tabular-nums}
.kbtn span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--mut)}
.kbtn .ph{color:#8592a3;font-style:italic}
.kbtn i{font-style:normal;color:var(--mut);font-size:11px}
.kbtn.soll b{color:var(--soll)}.kbtn.haben b{color:var(--haben)}
.satz{display:block;text-align:center;color:var(--mut)}
.zdel{width:36px;height:36px;border:1px solid transparent;background:none;border-radius:4px;color:#8a95a3;font-size:16px}
.zdel:hover{background:var(--badbg);color:var(--bad)}
.zhint{grid-column:2/-1;font-size:13.5px;color:var(--bad)}.okz .zhint{color:var(--ok)}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.msum{margin-left:auto;font-size:13.5px}
.btnrow.main{justify-content:flex-end}
#fb .msg,#tippbox .msg{margin-top:10px}
.gebucht-info{margin-bottom:8px}
/* Rückmeldung + Motivation (wie Buchungstrainer) */
.msg{border-radius:6px;padding:10px 14px;font-weight:600;margin-top:10px;border:1px solid transparent}
.msg.ok{background:var(--okbg);color:var(--ok);border-color:#a8d5b3}.msg.bad{background:var(--badbg);color:var(--bad);border-color:#efb1ab}.msg.info{background:#fff6dc;color:#6a4e00;border-color:#efd88f}
.msg .mut{font-weight:500;color:var(--txt);margin-top:4px}
.msg.tipp div{margin:3px 0;font-weight:500}
.serie{display:flex;justify-content:flex-end;align-items:center;gap:5px;min-height:22px;margin-top:6px;font-size:.88rem;font-weight:600;color:#b4690e}
.serie.leer{min-height:6px}
.lobzeile{display:flex;align-items:center;gap:10px}
.msg.ok .pop{color:var(--ok);flex:0 0 auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.meilenstein{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 14px;border-radius:6px;background:#fff4e0;color:#8a4d00;font-weight:700;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
#konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#konfetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.7}}
@media (prefers-reduced-motion:reduce){.msg.ok .pop,.meilenstein{animation:none}#konfetti{display:none}}
/* Beleg + Zoom */
.beleg-frame{margin:4px 0 6px;position:relative;overflow:hidden;border-radius:4px;cursor:zoom-in;background:#e8ecf0}
.beleg-frame .scaler{transform-origin:0 0;width:max-content}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(40,44,52,.92);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.open{display:block}
.zoom .zin{padding:60px 14px 30px;width:max-content;margin:0 auto}
.zoom .zclose{position:fixed;top:10px;right:10px;z-index:71;min-height:44px;min-width:44px;border-radius:99px;border:0;background:#fff;font-weight:700;padding:0 16px}
/* Konto-Auswahl */
#pickerbg{display:none;position:fixed;inset:0;z-index:40}
#pickerbg.open{display:block}
#picker{display:none;position:fixed;z-index:41;background:#fff;border:1px solid #7f93ab;border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,.25);flex-direction:column;max-height:360px}
#picker.open{display:flex}
.pk-h{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#e9eff6,#d7e1ec);padding:4px 4px 4px 10px;font-size:14px}
.pk-x{border:0;background:none;width:40px;height:36px;font-size:16px}
#pk-q{margin:6px;min-height:40px;border:1px solid #9aa9ba;border-radius:3px;padding:6px 10px;font-size:16px}
#pk-l{list-style:none;margin:0;padding:0 0 4px;overflow-y:auto;flex:1}
#pk-l li{display:flex;gap:10px;padding:7px 10px;min-height:44px;cursor:pointer;border-top:1px solid #eef1f4;align-items:flex-start}
#pk-l li b{min-width:48px;font-variant-numeric:tabular-nums;color:var(--blau)}
#pk-l li span{display:flex;flex-direction:column}#pk-l li small{color:var(--mut);font-size:12px}
#pk-l li.akt,#pk-l li:hover:not(.dis){background:#dbe9fa}
#pk-l li.dis{cursor:not-allowed;opacity:.55}
#pk-l li.leer{opacity:1;color:var(--mut)}
/* Hilfe-Blase, Dialog, Tour, Meldung */
#hilfe{display:none;position:fixed;z-index:65;background:#fffef5;border:1px solid #d9c66f;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:8px 12px;font-size:14px}
#hilfe.open{display:block}
#hilfe .hh{display:flex;justify-content:space-between;align-items:center;gap:8px}
#hilfe .hh button{border:0;background:none;width:36px;height:32px}
#hilfe p{margin:4px 0 2px}
#dlg{display:none;position:fixed;inset:0;z-index:55;background:rgba(20,30,45,.45);padding:40px 16px;overflow:auto}
#dlg.open{display:block}
.dlgin{background:#fff;border:1px solid #7f93ab;border-radius:4px;max-width:860px;margin:0 auto;box-shadow:0 12px 32px rgba(0,0,0,.3)}
kbd{border:1px solid #9aa9ba;border-bottom-width:2px;border-radius:3px;padding:0 5px;background:#f6f8fa;font-size:13px}

const cents = x => Math.round(x * 100);
function eur(x, mitZeichen = true) {
  const neg = x < 0; const c = Math.abs(cents(x));
  const ganz = Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const s = ganz + "," + String(c % 100).padStart(2, "0");
  return (neg ? "−" : "") + s + (mitZeichen ? "\u00a0€" : "");
}
const zahl = x => eur(x, false);
function menge(x) { return Number.isInteger(x) ? String(x) : String(x).replace(".", ","); }
/* Betrag aus Eingabe lesen: "6.400,00", "6400", "6400,5", "€ 6 400", "6400.50" */
function parseBetrag(s) {
  if (s == null) return null;
  let t = String(s).replace(/[€\s\u00a0]/g, "").replace(/^EUR/i, "");
  if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}

  const [t, m, j] = d.split(".").map(Number); const x = new Date(Date.UTC(j, m - 1, t + tage));
  return String(x.getUTCDate()).padStart(2, "0") + "." + String(x.getUTCMonth() + 1).padStart(2, "0") + "." + x.getUTCFullYear();
}

/* ---------- Buchhaltung: Journal, Salden, OP, UVA (live berechnet) ---------- */
function journal() {
  const ids = EROEFFNUNG.map(b => b.beleg_id).concat(ST.gebucht);
  const out = []; let nr = 0;
  ids.forEach(id => { const b = BEL[id]; b.buchung.zeilen.forEach(z => out.push({
    nr: ++nr, datum: b.belegdatum, beleg: b.beleg_id, text: z.text, soll: z.soll, haben: z.haben,
    betrag: z.betrag, steuercode: z.steuercode || "", periode: b.buchungsperiode, op: z.op_nummer || "" })); });
  return out;
}
function salden(j = journal()) {
  const s = {};
  const add = (k, f, v) => { s[k] = s[k] || { s: 0, h: 0 }; s[k][f] += cents(v); };
  j.forEach(z => { add(z.soll, "s", z.betrag); add(z.haben, "h", z.betrag); });
  return s;
}
function saldenliste() {
  const s = salden(); const zeile = nr => { const x = s[nr] || { s: 0, h: 0 }; return { nr, name: kname(nr), s: x.s, h: x.h, saldo: x.s - x.h }; };
  const nrs = Object.keys(s).sort((a, b) => KONTO[a].pos - KONTO[b].pos);
  const sach = nrs.filter(n => KONTO[n].kontotyp === "Sachkonto").map(zeile);
  const pers = nrs.filter(n => KONTO[n].kontotyp !== "Sachkonto").map(zeile);
  const sammel = {};
  pers.forEach(p => { const sk = (PERSON[p.nr] || {}).sammelkonto || (typeof KONTO[p.nr].sammelkonto === "string" ? KONTO[p.nr].sammelkonto : null); if (!sk) return;
    sammel[sk] = sammel[sk] || { nr: sk, name: kname(sk), s: 0, h: 0, saldo: 0 }; sammel[sk].s += p.s; sammel[sk].h += p.h; sammel[sk].saldo += p.saldo; });
  const sum = [...sach, ...pers].reduce((a, z) => ({ s: a.s + z.s, h: a.h + z.h }), { s: 0, h: 0 });
  return { sach, pers, sammel: Object.values(sammel).sort((a, b) => KONTO[a.nr].pos - KONTO[b.nr].pos), sum };
}
function offenePosten() {

    const ops = {}; const order = [];

      if (!z.op || (z.soll !== p.kontonummer && z.haben !== p.kontonummer)) return;
      const rechnungsseite = kunde ? z.soll === p.kontonummer : z.haben === p.kontonummer;
      if (!ops[z.op]) { ops[z.op] = { op: z.op, rechnung: "", datum: "", betrag: 0, bezahlt: 0, zahlungen: [] }; order.push(z.op); }
      const o = ops[z.op];
      if (rechnungsseite) { o.betrag += cents(z.betrag); if (!o.rechnung) { o.rechnung = z.beleg; o.datum = z.datum; } }
      else { o.bezahlt += cents(z.betrag); o.zahlungen.push({ beleg: z.beleg, datum: z.datum, betrag: z.betrag }); }
    });
    const posten = order.map(k => { const o = ops[k]; o.offen = o.betrag - o.bezahlt; o.status = o.offen === 0 ? "bezahlt" : o.bezahlt ? "teilweise bezahlt" : "offen"; return o; });
    return { konto: p.kontonummer, name: p.name, art: p.art, ziel: p.zahlungsziel_tage, posten, offen: posten.reduce((a, o) => a + o.offen, 0) };
  });
}

function aufgabePruefen(a, wert) {
  const r = a.richtige_antwort;
  if (Array.isArray(r)) {
    const soll = r.map(Number).sort((x, y) => x - y);
    const ist = (String(wert).match(/\d+/g) || []).map(Number).sort((x, y) => x - y);
    return ist.length === soll.length && ist.every((x, i) => x === soll[i]);
  }
  const v = parseBetrag(wert);
  return v != null && !isNaN(v) && cents(v) === cents(Number(r));
}

/* Prüfen: Reihenfolge der Zeilen egal; Text und OP-Nr. werden nicht bewertet */
const key = z => z.soll + ">" + z.haben + ">" + cents(z.betrag);
function multisetGleich(a, b) { if (a.length !== b.length) return false; const x = a.slice().sort(), y = b.slice().sort(); return x.every((v, i) => v === y[i]); }
function pruefe(b, zeilen) {
  const idx = [], ein = [];

    const z = zeilen[i];
    if (!z.soll && !z.haben && !String(z.betrag).trim()) continue;
    const v = parseBetrag(z.betrag);
    if (!z.soll || !z.haben || v == null) return { ok: false, art: "unvollstaendig", msg: `In Zeile ${i + 1} fehlt noch etwas. Jede Zeile braucht Konto (Soll), Gegenkonto (Haben) und Betrag. Leere Zeilen kannst du löschen.` };
    if (isNaN(v) || v <= 0) return { ok: false, art: "unvollstaendig", msg: `In Zeile ${i + 1} ist der Betrag keine gültige Zahl. Schreib z. B. 1.280,00 oder 1280.` };
    if (z.soll === z.haben) return { ok: false, art: "unvollstaendig", msg: `In Zeile ${i + 1} sind Konto und Gegenkonto gleich. Eine Buchung braucht zwei verschiedene Konten.` };
    idx.push(i); ein.push({ soll: z.soll, haben: z.haben, betrag: v, code: z.code || "" });
  }
  if (!ein.length) return { ok: false, art: "unvollstaendig", msg: "Die Maske ist noch leer. Wähle in Zeile 1 Konto (Soll) und Gegenkonto (Haben) und gib den Betrag ein." };
  const sol = b.buchung.zeilen;
  const marks = zeilen.map(() => null);
  if (multisetGleich(ein.map(key), sol.map(key))) {
    const rest = sol.slice(); const falsch = [];
    ein.forEach((z, k) => { const j = rest.findIndex(s => key(s) === key(z)); const s = rest.splice(j, 1)[0];
      const ok = (s.steuercode || "") === z.code;
      marks[idx[k]] = { ok, hint: ok ? "" : (s.steuercode ? `Diese Zeile braucht einen Steuercode.` : "Diese Zeile bekommt keinen Steuercode.") };
      if (!ok) falsch.push(idx[k] + 1); });
    if (!falsch.length) return { ok: true };
    const sc = DATA.buchungskonvention.steuercodes;
    return { ok: false, art: "steuercode", marks, msg: `Konten und Beträge stimmen! Nur der Steuercode passt noch nicht (Zeile ${falsch.join(" und ")}).`,
      zusatz: `${HILFE.Steuercode} V20 = ${sc.V20}. U20 = ${sc.U20}.` };
  }
  for (const tf of b.typische_fehler || []) {
    if (multisetGleich(ein.map(key), tf.eingabe.map(key))) return { ok: false, art: "typisch", msg: tf.feedback, marks: zeilenMarks(ein, idx, sol, marks) };
  }
  zeilenMarks(ein, idx, sol, marks);
  let msg = "Noch nicht richtig. Schau dir die markierten Zeilen an.";
  if (ein.length < sol.length) msg = `Es fehlt noch eine Zeile. ${DATA.buchungskonvention.regel}`;
  else if (ein.length > sol.length) msg = "Du hast zu viele Zeilen gebucht. Prüfe, welche Zeile nicht zum Beleg passt.";
  return { ok: false, art: "allgemein", marks, msg, zusatz: "Frag dich: Wohin geht der Wert (Soll)? Woher kommt er (Haben)? Der Tipp-Knopf hilft dir." };
}
function zeilenMarks(ein, idx, sol, marks) {
  const rest = sol.slice();
  ein.forEach((z, k) => { const j = rest.findIndex(s => key(s) === key(z)); if (j >= 0) { rest.splice(j, 1); marks[idx[k]] = { ok: true, hint: "" }; } });
  ein.forEach((z, k) => {
    if (marks[idx[k]]) return;
    const c = cents(z.betrag); let hint = "Diese Zeile passt nicht zum Beleg.";
    if (sol.some(s => s.soll === z.haben && s.haben === z.soll && cents(s.betrag) === c)) hint = "Soll und Haben sind vertauscht. Dieses Konto gehört auf die andere Seite.";
    else if (sol.some(s => s.soll === z.soll && s.haben === z.haben)) hint = "Die Konten stimmen, der Betrag nicht. Rechne nach: netto, Steuer oder brutto?";
    else if (sol.some(s => s.soll === z.soll && cents(s.betrag) === c)) hint = "Konto (Soll) und Betrag stimmen. Das Gegenkonto (Haben) passt nicht.";
    else if (sol.some(s => s.haben === z.haben && cents(s.betrag) === c)) hint = "Gegenkonto (Haben) und Betrag stimmen. Das Konto (Soll) passt nicht.";
    else if (sol.some(s => cents(s.betrag) === c)) hint = "Der Betrag passt, aber die Konten nicht.";
    else if (sol.some(s => s.soll === z.soll || s.haben === z.haben)) hint = "Ein Konto passt, der Rest noch nicht.";

}

    <tr><td><kbd>Alt</kbd>+<kbd>N</kbd></td><td>neue Buchungszeile</td></tr><tr><td><kbd>F1</kbd></td><td>Hilfe zum aktuellen Feld</td></tr><tr><td><kbd>Esc</kbd></td><td>Liste, Hilfe oder Fenster schließen</td></tr>

}
function feldNachEnter(el) {
  const order = ["soll", "haben", "betrag", "code", "text", "op"];
  const [i, f] = el.dataset.f.split("-"); const k = order.indexOf(f);

}
function onClick(ev) {

  if (t.classList.contains("q")) { ev.preventDefault(); ev.stopPropagation(); showHilfe(t); return; }

  if (d.konto) { kontoblatt(d.konto); return; }

  if (d.zoom || t.id === "belegframe") { zoomBeleg(belegHtml(BEL[SEL].beleg, symText(BEL[SEL]))); return; }
  if (d.kpick) { openPicker(t); return; }
  const b = BEL[SEL];
  if (d.del != null) { const e = entwurf(b); e.zeilen.splice(Number(d.del), 1); if (!e.zeilen.length) e.zeilen.push(neueZeile(b)); RES = null; save(); renderMaske(); return; }
  if (t.id === "addz") { const e = entwurf(b); e.zeilen.push(neueZeile(b)); save(); renderMaske(`${e.zeilen.length - 1}-soll`); return; }
  if (t.id === "leeren") { const e = entwurf(b); e.zeilen = [neueZeile(b), neueZeile(b)]; RES = null; save(); renderMaske("0-soll"); return; }
  if (t.id === "buchen") { buchen(); return; }
  if (t.id === "tipp") { const e = entwurf(b); e.tipp = true; save(); $("#tippbox").innerHTML = tippHtml(b); return; }
  if (t.id === "loesung") { const e = entwurf(b); e.loesung = true;
    e.zeilen = b.buchung.zeilen.map(z => ({ soll: z.soll, haben: z.haben, betrag: zahl(z.betrag), code: z.steuercode || "", text: z.text, op: z.op_nummer || "" }));
    RES = { id: b.beleg_id, ok: false, art: "loesung", msg: "So ist es richtig. Schau dir die Zeilen genau an und klicke dann auf „Buchen“." }; save(); renderMaske("0-soll"); return; }
  if (t.id === "menubtn") { document.body.classList.contains("drawer") ? closeDrawer() : openDrawer(); return; }
  if (d.apruef) { const a = DATA.aufgaben.find(x => x.id === d.apruef); const v = $("#ae-" + a.id).value; const s = ST.aufgaben[a.id] = ST.aufgaben[a.id] || { versuche: 0 };
    s.eingabe = v; if (aufgabePruefen(a, v)) s.ok = true; else { s.ok = false; s.versuche++; } save(); render(); const el = $(`.aufg[data-id="${a.id}"] .afb`); if (el) el.scrollIntoView({ block: "nearest" }); return; }
  if (d.aloes) { ST.aufgaben[d.aloes].loesung = true; save(); render(); return; }
}
function onKey(ev) {
  const el = document.activeElement;

  if (ev.key === "F1") { ev.preventDefault(); const f = el && el.dataset && el.dataset.f ? el.dataset.f.split("-")[1] : null; const fld = el && el.closest && el.closest(".fld");
    const qb = f && fld ? $(`.q[data-hilfe="${F1KEY[f]}"]`, fld) : null; if (qb) showHilfe(qb); else go("begriffe"); return; }
  if (ev.altKey && !ev.ctrlKey && !ev.metaKey) { const m = { b: "belegerfassung", j: "journal", s: "saldenliste", u: "uva", o: "offene_posten" }[ev.key.toLowerCase()];
    if (m) { ev.preventDefault(); go(m); return; }
    if (ev.key.toLowerCase() === "n" && $("#addz")) { ev.preventDefault(); $("#addz").click(); return; } }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter" && $("#maske")) { ev.preventDefault(); buchen(); return; }
  if (!el || !el.dataset) return;
  if (el.dataset.kpick && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
    if (ev.key.length === 1 && /[0-9a-zäöüß]/i.test(ev.key)) { ev.preventDefault(); openPicker(el, ev.key); return; }
    if (ev.key === "ArrowDown" || ev.key === "F4") { ev.preventDefault(); openPicker(el); return; }

  if (ev.key === "Enter" && el.dataset.feld && !ev.ctrlKey) { ev.preventDefault();

}
function betragFormat(el) { const v = parseBetrag(el.value); if (v && !isNaN(v) && v > 0) { const f = zahl(v); if (f !== el.value) { el.value = f; onInput({ target: el }); } } }

  const bz = el.closest(".bz"); if (bz) { bz.classList.remove("okz", "badz"); const h = $(".zhint", bz); if (h) h.remove(); }
  save();
}
function init() {
  document.addEventListener("click", onClick);
  document.addEventListener("keydown", onKey);
  document.addEventListener("input", onInput);
  document.addEventListener("change", ev => { if (ev.target.dataset && ev.target.dataset.feld === "code") onInput(ev); });
  document.addEventListener("focusout", ev => { const el = ev.target; if (el.dataset && el.dataset.feld === "betrag" && $("#maske")) betragFormat(el); });

  $("#dlg").onclick = ev => { if (ev.target.id === "dlg") $("#dlg").classList.remove("open"); };
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== VIEW && VIEWS[v]) go(v); });
  const h = location.hash.slice(1); VIEW = VIEWS[h] ? h : "start";
  $("#menubtn").innerHTML = icon("menu", 24);
  $("#menubar").innerHTML = menuHtml();
  render();
  if (!ST.tour) tourZeigen(0);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => { });
}
/* für automatische Tests (liest nur) */
window.UEBUNG_API = { journal, saldenliste, offenePosten, uva, state: () => ST };
document.addEventListener("DOMContentLoaded", init);
