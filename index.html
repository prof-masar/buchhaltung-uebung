<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b5c">
<meta name="robots" content="noindex">
<title>Buchhaltungs-Software</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3b5c'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h20' stroke='%23f2b134' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
/* Buchhaltungs-Software – Oberfläche im Stil klassischer Buchhaltungssoftware */
:root{--blau:#1f3b5c;--blau2:#2d5580;--akz:#0b63c5;--grau:#e9edf2;--grau2:#d5dbe3;--rand:#b9c3cf;--txt:#1b2430;--mut:#5a6675;--ok:#1e7b34;--okbg:#e7f5ea;--bad:#b3261e;--badbg:#fdecea;--info:#0b4f8a;--infobg:#e8f1fb;--soll:#0b4f8a;--haben:#8a3b0b;--sel:#fff6cc}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);background:#c9d1db;display:flex;flex-direction:column;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f5a623;outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;vertical-align:middle}
/* Titelleiste */
.titlebar{background:linear-gradient(#25476e,var(--blau));color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;flex:none}
.titlebar .app{font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.titlebar .appic{width:22px;height:22px;border-radius:4px;background:#f2b134;color:var(--blau);display:grid;place-items:center;font-weight:800;font-size:13px}
.titlebar .mand{opacity:.85;font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menubtn{display:none;background:none;border:0;color:#fff;width:44px;height:40px;margin-left:-8px}
#mtitle{display:none;font-weight:600}
/* Menüleiste */
#menubar{background:#f4f6f9;border-bottom:1px solid var(--rand);display:flex;padding:0 6px;flex:none;position:relative;z-index:30}
.mb{position:relative}
.mbtn{background:none;border:0;padding:6px 12px;min-height:32px;border-radius:3px}
.mbtn:hover,.mb.open .mbtn{background:#dfe6ef}
.mdrop{display:none;position:absolute;left:0;top:100%;min-width:260px;background:#fff;border:1px solid var(--rand);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px 0}
.mb.open .mdrop{display:block}
.mdrop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;min-height:40px}
.mdrop button:hover,.mdrop button:focus{background:var(--infobg)}
/* Symbolleiste */
#toolbar{background:linear-gradient(#fbfcfd,#eceff3);border-bottom:1px solid var(--rand);display:flex;gap:2px;padding:4px 6px;flex:none;overflow-x:auto}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:1px solid transparent;border-radius:4px;padding:4px 8px;min-width:64px;min-height:48px;font-size:12px;color:#26384d}
.tb:hover{background:#e3eaf3;border-color:#c4d0de}
.tb.akt{background:#d6e4f5;border-color:#9fb8d6}
.tsep{width:1px;background:var(--rand);margin:4px 6px}
/* Arbeitsbereich */
.work{flex:1;display:flex;min-height:0}
#nav{width:228px;flex:none;background:#eef1f5;border-right:1px solid var(--rand);overflow-y:auto;padding:8px 0}
.navgrp{margin-bottom:8px}
.navh{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:6px 14px 3px;font-weight:600}
.navi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-left:3px solid transparent;padding:9px 12px;min-height:44px;text-align:left;color:#1f2d3d}
.navi:hover{background:#e0e7f0}
.navi.akt{background:#fff;border-left-color:var(--akz);font-weight:600;color:var(--blau)}
.navi .badge{margin-left:auto;font-size:12px;background:var(--blau2);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.navi.tour-hl{background:#fff3c4;border-left-color:#f2b134;box-shadow:inset 0 0 0 2px #f2b134}
#main{flex:1;overflow:auto;padding:12px;min-width:0}
#drawerbg{display:none}
/* Statusleiste */
#statusbar{background:#dfe4ea;border-top:1px solid var(--rand);display:flex;gap:4px;align-items:center;font-size:12.5px;padding:3px 8px;flex:none;flex-wrap:wrap}
.sb-item{padding:2px 10px;border-right:1px solid var(--rand);display:inline-flex;align-items:center;gap:6px}
.sb-r{margin-left:auto;border:0}
.bar{display:inline-block;width:90px;height:8px;background:#fff;border:1px solid var(--rand);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.lg{width:100%;height:12px;border-radius:6px;margin:6px 0}
.serie-sb{color:#b4690e;font-weight:600}.serie-sb svg{width:16px;height:16px}
/* Fenster */
.win{background:#fff;border:1px solid #9fadbd;border-radius:4px;box-shadow:0 2px 6px rgba(20,40,70,.12);margin-bottom:12px;min-width:0}
.wtitle{display:flex;align-items:center;gap:10px;background:linear-gradient(#e9eff6,#d7e1ec);border-bottom:1px solid #a9b8c9;padding:5px 10px;border-radius:4px 4px 0 0;min-height:36px}
.wtitle h1{font-size:15px;margin:0;display:flex;align-items:center;gap:7px;color:var(--blau)}
.wpath{margin-left:auto;font-size:12px;color:var(--mut)}
.wbody{padding:12px 14px}
.tbtn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--rand);border-radius:4px;padding:4px 10px;min-height:34px;min-width:34px;font-size:13px}
.erkl{background:#f5f8fb;border:1px solid #dbe3ec;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.erkl p{margin:0 0 4px}
.erkl details summary{cursor:pointer;color:var(--akz);padding:6px 0;min-height:32px}
.erkl ul{margin:4px 0 4px 18px;padding:0}.erkl li{margin:3px 0}
.ht{color:var(--mut)}
.hl{white-space:nowrap}
.q{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid #7f9bbd;background:#eef4fb;color:var(--akz);font-weight:700;font-size:12.5px;padding:0;margin-left:4px;vertical-align:middle;position:relative}
.q::after{content:"";position:absolute;inset:-8px}
.mut{color:var(--mut)}.small{font-size:13px}.nowrap{white-space:nowrap}
.note{background:#fff8e1;border:1px solid #f0d58a;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.sec{font-size:15px;color:var(--blau);margin:16px 0 8px;border-bottom:1px solid var(--grau2);padding-bottom:4px}
.linkbtn{background:none;border:0;color:var(--akz);text-decoration:underline;padding:6px 2px;min-height:32px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;background:linear-gradient(#fff,#eef1f5);border:1px solid #9aa9ba;border-radius:4px;padding:8px 16px;min-height:44px;font-weight:500}
.btn:hover{background:#e6edf5}
.btn.primary{background:linear-gradient(#2f6fb9,#1f569a);border-color:#1a4a85;color:#fff;font-weight:600}
.btn.primary:hover{background:#1f569a}
.btn.big{min-width:160px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filter{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.filter input{flex:1;max-width:420px;min-height:40px;border:1px solid #9aa9ba;border-radius:3px;padding:6px 10px}
.tag{display:inline-block;font-size:11.5px;background:#eef1f5;border:1px solid var(--grau2);border-radius:3px;padding:0 6px;color:var(--mut);font-weight:400}
/* Tabellen */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rand)}
table.grid{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.grid th{background:#e4eaf1;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--rand);border-right:1px solid #cfd8e2;white-space:nowrap;position:sticky;top:0}
.grid td{padding:5px 8px;border-bottom:1px solid #e3e8ee;border-right:1px solid #eef1f4;vertical-align:top}
.grid tbody tr:nth-child(even){background:#f7f9fb}
.grid tbody tr:hover{background:#eaf2fc}
.grid .num{text-align:right;font-variant-numeric:tabular-nums}
.grid tfoot td{background:#e9eef4;font-weight:600;border-top:2px solid var(--rand)}
.grid tr.neu{background:#fff4c2!important}
.grid tr.sammel{color:var(--mut);font-style:italic}
.grid td.soll,.grid .soll{color:var(--soll)}.grid td.haben{color:var(--haben)}
.grid .txt{min-width:180px}
.kl-link{background:none;border:0;padding:2px 0;color:var(--akz);text-decoration:underline dotted;font-variant-numeric:tabular-nums;min-height:28px}
.kv{border-collapse:collapse;width:100%}.kv th{text-align:left;color:var(--mut);font-weight:500;padding:4px 10px 4px 0;vertical-align:top;white-space:nowrap}.kv td{padding:4px 0}
/* Übersicht */
.hero{background:linear-gradient(135deg,#eaf2fb,#f8fbff);border:1px solid #c9daee;border-radius:6px;padding:12px 16px;margin-bottom:12px}
.hero .wir{font-size:17px;margin:0 0 4px}.hero p{margin:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--grau2);border-radius:6px;padding:12px 14px;background:#fff}
.card h2{font-size:15px;margin:0 0 6px;color:var(--blau)}
.card .big{font-size:20px;font-weight:600;margin:0}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.modcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--grau2);border-radius:6px;padding:12px;min-height:64px}
.modcard:hover{border-color:var(--akz);background:#f5f9ff}
.modcard .ic{color:var(--blau2);margin-top:2px}
.modcard b{display:block;color:var(--blau)}.modcard small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
/* Saldenliste, OP, UVA */
.opsummen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opsummen div{border:1px solid var(--grau2);border-radius:6px;padding:10px 14px;background:#f7f9fb}
.opsummen span{display:block;color:var(--mut);font-size:13px}.opsummen b{font-size:19px}
.opk{border:1px solid var(--rand);border-radius:4px;margin-bottom:10px;overflow:hidden}
.oph{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;background:#eef2f7;padding:6px 10px}
.opk .tscroll{border:0}
.st{display:inline-block;border-radius:10px;padding:0 8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}.st.offen{background:#fff1d6;color:#8a5300}
.uvakopf{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.uvatab tr.tot td{font-weight:700;background:#eef4fb}
.formel{display:flex;align-items:stretch;gap:8px;margin:14px 0;flex-wrap:wrap}
.fz{border:1px solid var(--grau2);border-radius:6px;padding:8px 14px;background:#f7f9fb;min-width:150px}
.fz span{display:block;font-size:13px;color:var(--mut)}.fz b{font-size:19px}
.fz.op{border:0;background:none;min-width:0;font-size:24px;display:flex;align-items:center;padding:0 2px}
.fz.erg{background:var(--infobg);border-color:#9cc1e8}
/* Glossar */
.glossar{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.glossar div{border:1px solid var(--grau2);border-radius:4px;padding:8px 12px}
.glossar dt{font-weight:600;color:var(--blau)}.glossar dd{margin:2px 0 0}
/* Lernaufgaben */
.aufg{border:1px solid var(--grau2);border-radius:6px;padding:12px;margin-bottom:10px}
.aufgk{display:flex;gap:10px}
.anr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blau2);color:#fff;display:grid;place-items:center;font-weight:700}
.frage{margin:2px 0 0;font-weight:500}
.aein{display:flex;gap:8px;margin:8px 0 0 38px;flex-wrap:wrap}
.aein input{flex:1;min-width:160px;max-width:300px;min-height:44px;border:1px solid #9aa9ba;border-radius:3px;padding:6px 10px;font-size:16px}
.afb{margin-left:38px}
/* Belegerfassung */
.stapel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid #9fadbd;border-radius:4px;padding:6px 8px;margin-bottom:10px}
.stl{font-size:13px;color:var(--mut);margin-right:4px}
.chip{border:1px solid var(--rand);background:#f4f6f9;border-radius:14px;padding:4px 12px;min-height:36px;font-size:13.5px;white-space:nowrap}
.chip.ok{background:var(--okbg);border-color:#9ccfa8;color:var(--ok)}
.chip.jetzt{background:#fff3c4;border-color:#e2b93b;font-weight:700}
.chip.zu{color:#8592a3}
.chip.sel{box-shadow:0 0 0 2px var(--akz)}
.erf{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;align-items:start}
.bwin .wbody{padding:8px}
.zoomhint{font-size:12.5px;color:var(--mut);text-align:center}
.bkopf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.kf{display:flex;flex-direction:column;gap:2px}
.kfl,.ml{font-size:12.5px;color:var(--mut);display:flex;align-items:center;white-space:nowrap}
.kf output{border:1px solid #c5ced9;background:#f1f4f7;border-radius:3px;padding:6px 8px;min-height:36px;font-weight:600}
.gfall{background:#f5f8fb;border:1px solid #dbe3ec;border-radius:4px;padding:8px 12px;margin-bottom:10px}
.konv{margin:6px 0 8px 18px;padding:0}.konv li{margin:3px 0}
.maske{border:1px solid #9fadbd;border-radius:4px;background:#f3f6f9;padding:8px}
.mhead{display:grid;grid-template-columns:28px 1.4fr 1.4fr 1fr 74px 52px 1.3fr .9fr 36px;gap:6px;font-size:12.5px;color:var(--mut);padding:0 4px 4px}
.mhead span{display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.bz{display:grid;grid-template-columns:28px 1.4fr 1.4fr 1fr 74px 52px 1.3fr .9fr 36px;gap:6px;align-items:center;background:#fff;border:1px solid #d3dbe5;border-radius:4px;padding:5px 4px;margin-bottom:5px}
.bz .ml{display:none}
.bz.okz{border-color:#7cc08d;background:#f2fbf4}.bz.badz{border-color:#e08b84;background:#fff6f5}
.zn{font-weight:700;color:var(--mut);text-align:center}
.fld{min-width:0}
.bz input,.bz select,.kbtn{width:100%;min-height:40px;border:1px solid #9aa9ba;border-radius:3px;background:#fff;padding:4px 7px}
.bz input.betrag{text-align:right;font-variant-numeric:tabular-nums}
.bz input:focus,.bz select:focus,.kbtn:focus{background:var(--sel)}
.kbtn{display:flex;align-items:center;gap:6px;text-align:left;overflow:hidden}
.kbtn b{font-variant-numeric:tabular-nums}
.kbtn span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--mut)}
.kbtn .ph{color:#8592a3;font-style:italic}
.kbtn i{font-style:normal;color:var(--mut);font-size:11px}
.kbtn.soll b{color:var(--soll)}.kbtn.haben b{color:var(--haben)}
.satz{display:block;text-align:center;color:var(--mut)}
.zdel{width:36px;height:36px;border:1px solid transparent;background:none;border-radius:4px;color:#8a95a3;font-size:16px}
.zdel:hover{background:var(--badbg);color:var(--bad)}
.zhint{grid-column:2/-1;font-size:13.5px;color:var(--bad)}.okz .zhint{color:var(--ok)}
.zauto{grid-column:2/-1;font-size:13px;color:#3d4b5c;display:flex;flex-wrap:wrap;gap:2px 14px}.zauto:empty{display:none}
.zauto .autoh{margin-left:0;margin-right:4px;background:#e6f0fb;border-color:#b9d1ec;color:#1f4f86}
.zauto b{font-variant-numeric:tabular-nums}
.bmodus{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0 0 8px;font-size:14px}.bmodus label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.tag.auto{background:#e6f0fb;border-color:#b9d1ec;color:#1f4f86}
tr.autoz td{background:#f6f9fd;color:#3d4b5c}tr.autoz td.txt{font-style:italic}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.msum{margin-left:auto;font-size:13.5px}
.btnrow.main{justify-content:flex-end}
#fb .msg,#tippbox .msg{margin-top:10px}
.gebucht-info{margin-bottom:8px}
/* Rückmeldung + Motivation (wie Buchungstrainer) */
.msg{border-radius:6px;padding:10px 14px;font-weight:600;margin-top:10px;border:1px solid transparent}
.msg.ok{background:var(--okbg);color:var(--ok);border-color:#a8d5b3}.msg.bad{background:var(--badbg);color:var(--bad);border-color:#efb1ab}.msg.info{background:#fff6dc;color:#6a4e00;border-color:#efd88f}
.msg .mut{font-weight:500;color:var(--txt);margin-top:4px}
.msg.tipp div{margin:3px 0;font-weight:500}
.serie{display:flex;justify-content:flex-end;align-items:center;gap:5px;min-height:22px;margin-top:6px;font-size:.88rem;font-weight:600;color:#b4690e}
.serie.leer{min-height:6px}
.lobzeile{display:flex;align-items:center;gap:10px}
.msg.ok .pop{color:var(--ok);flex:0 0 auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.meilenstein{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 14px;border-radius:6px;background:#fff4e0;color:#8a4d00;font-weight:700;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
#konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#konfetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.7}}
@media (prefers-reduced-motion:reduce){.msg.ok .pop,.meilenstein{animation:none}#konfetti{display:none}}
/* Beleg + Zoom */
.beleg-frame{margin:4px 0 6px;position:relative;overflow:hidden;border-radius:4px;cursor:zoom-in;background:#e8ecf0}
.beleg-frame .scaler{transform-origin:0 0;width:max-content}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(40,44,52,.92);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.open{display:block}
.zoom .zin{padding:60px 14px 30px;width:max-content;margin:0 auto}
.zoom .zclose{position:fixed;top:10px;right:10px;z-index:71;min-height:44px;min-width:44px;border-radius:99px;border:0;background:#fff;font-weight:700;padding:0 16px}
/* Konto-Auswahl */
#pickerbg{display:none;position:fixed;inset:0;z-index:40}
#pickerbg.open{display:block}
#picker{display:none;position:fixed;z-index:41;background:#fff;border:1px solid #7f93ab;border-radius:4px;box-shadow:0 10px 28px rgba(0,0,0,.25);flex-direction:column;max-height:360px}
#picker.open{display:flex}
.pk-h{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#e9eff6,#d7e1ec);padding:4px 4px 4px 10px;font-size:14px}
.pk-x{border:0;background:none;width:40px;height:36px;font-size:16px}
#pk-q{margin:6px;min-height:40px;border:1px solid #9aa9ba;border-radius:3px;padding:6px 10px;font-size:16px}
#pk-l{list-style:none;margin:0;padding:0 0 4px;overflow-y:auto;flex:1}
#pk-l li{display:flex;gap:10px;padding:7px 10px;min-height:44px;cursor:pointer;border-top:1px solid #eef1f4;align-items:flex-start}
#pk-l li b{min-width:48px;font-variant-numeric:tabular-nums;color:var(--blau)}
#pk-l li span{display:flex;flex-direction:column}#pk-l li small{color:var(--mut);font-size:12px}
#pk-l li.akt,#pk-l li:hover:not(.dis){background:#dbe9fa}
#pk-l li.dis{cursor:not-allowed;opacity:.55}
#pk-l li.leer{opacity:1;color:var(--mut)}
/* Hilfe-Blase, Dialog, Tour, Meldung */
#hilfe{display:none;position:fixed;z-index:65;background:#fffef5;border:1px solid #d9c66f;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:8px 12px;font-size:14px}
#hilfe.open{display:block}

":"Skonto brutto € 129,60. Davon Vorsteuer: € 129,60 : 120 × 20 = € 21,60. Die Vorsteuer wird um diesen Betrag kleiner.","berechnung":{"art":"kontoblatt_haben","konto":"2500","beleg":"BA 3"}},{"id":"K5","thema":"Kontoblatt","modul":"kontoblatt","frage":"Kontoblatt 3500 Umsatzsteuer: Wie hoch ist der Saldo Ende Oktober?","antwort_typ":"betrag","richtige_antwort":4523.0,"richtige_antwort_anzeige":"€ 4.523,00","hinweis_falsch":"Rechne Haben minus Soll. Das Storno von AR 4 steht im Soll.","loesungsweg":"Haben-Summe € 4.788,00 − Soll-Summe € 265,00 = € 4.523,00 im Haben. Das sind 20 % von € 22.615,00.","berechnung":{"art":"saldo","konto":"3500"}},{"id":"K6","thema":"Kontoblatt","modul":"kontoblatt","frage":"Kontoblatt 20040 Schick-Hotels: Wie viel schuldet uns der Kunde noch?","antwort_typ":"betrag","richtige_antwort":5800.0,"richtige_antwort_anzeige":"€ 5.800,00","hinweis_falsch":"Rechnung minus Teilzahlung. Nimm den Saldo in der letzten Zeile.","loesungsweg":"Rechnung € 10.800,00 − Teilzahlung € 5.000,00 = € 5.800,00 im Soll.","berechnung":{"art":"op_offen","konto":"20040"}},{"id":"K7","thema":"Kontoblatt","modul":"kontoblatt","frage":"Kontoblatt 2500 Vorsteuer: Wie viele Zeilen gibt es zu ER 6 und ST 1 (Fehlbuchung, Storno, Neubuchung zusammen)?","antwort_typ":"zahl","richtige_antwort":3,"richtige_antwort_anzeige":"3","hinweis_falsch":"Zähle die Zeilen mit Beleg ER 6 und ST 1.","loesungsweg":"3 Zeilen: die falsche Vorsteuer (V20), das Storno ST 1 im Haben und die richtige Vorsteuer (V10).","berechnung":{"art":"kontoblatt_zeilen","konto":"2500","belege":["ER 6","ST 1"]}}],"lernaufgaben":{"tag_1":{"tag":1,"themen":["Navigation","Stammdaten"],"aufgaben":["T1-1","T1-2"]},"tag_2":{"tag":2,"themen":["Stammdaten","Maske","Steuercodes","Offene Posten","Skonto"],"aufgaben":["T1-3","T1-4","T2-1","T2-6"],"einstieg":["Lege den Lieferanten Samsung Electronics Austria GmbH mit der Kontonummer 33050 an. Die Daten stehen auf dem Beleg ER 5.","Lege den Lieferanten MANZ'sche Verlags- und Universitätsbuchhandlung GmbH mit der Kontonummer 33060 an. Die Daten stehen auf dem Beleg ER 6."]},"tag_3":{"tag":3,"themen":["Stammdaten","Steuercodes","Journal","Bank","Kassa","Abstimmung","UVA","Perioden","Storno","Auswertungen","Abschlussparcours"],"aufgaben":["T1-5","T1-6","T2-2","T2-3","T2-4","T2-5","T3-1","T3-2","T3-3","T3-4","T3-5","T3-6"],"einstieg":["Lege den Kunden Schick-Hotels Betriebs GmbH mit der Kontonummer 20040 an. Die Daten stehen auf dem Beleg AR 3.","Lege den Kunden Impact Hub Vienna GmbH mit der Kontonummer 20050 an. Die Daten stehen auf dem Beleg AR 4."]}},"erklaertexte":[{"id":"mahnwesen","titel":"Mahnwesen","nur_erklaerung":true,"kennzeichnung":"Nur Erklärung – in dieser Stufe gibt es dazu keine Übung im Programm.","text":["Zahlt ein Kunde nicht bis zum Zahlungsziel, schicken wir eine Mahnung. Beispiel: AR 3 an Schick-Hotels ist vom 27.10.2026, Zahlungsziel 14 Tage. Fällig ist sie am 10.11.2026.","Nach der Teilzahlung sind noch € 5.800,00 offen. Ist der Rest nach dem 10.11.2026 nicht bezahlt, kommt eine Zahlungserinnerung.","Das Programm sucht dafür alle offenen Posten mit überschrittenem Zahlungsziel. Es schlägt eine Mahnstufe vor: 1. Zahlungserinnerung, 2. Mahnung, 3. letzte Mahnung.","Eine Mahnung ist keine Buchung. Sie ändert keinen Saldo."]},{"id":"anlagen","titel":"Anlagenbuchhaltung","nur_erklaerung":true,"kennzeichnung":"Nur Erklärung – in dieser Stufe gibt es dazu keine Übung im Programm.","text":["Anlagen sind Dinge, die wir lange im Betrieb nutzen, z. B. Regale, Computer oder ein Lieferwagen. Wir verkaufen sie nicht weiter.","Jede Anlage steht im Anlagenverzeichnis mit Anschaffungsdatum, Anschaffungswert und Nutzungsdauer.","Jedes Jahr verliert die Anlage an Wert. Das ist die Abschreibung. Das Programm rechnet sie aus dem Anlagenverzeichnis.","Im Oktober kaufen wir keine Anlage. Die Fachbücher (ER 6) sind keine Anlage, sondern Aufwand."]},{"id":"skonto","titel":"Skonto","nur_erklaerung":false,"text":["Skonto ist ein Abzug für schnelles Zahlen. Samsung gibt 2 % Skonto, wenn wir innerhalb von 10 Tagen zahlen.","Ausgangsbetrag € 6.480,00. 2 % von € 6.480,00 = € 129,60. Wir überweisen € 6.350,40.","Die Rechnung buchst du immer mit dem vollen Betrag. Den Skonto buchst du erst bei der Zahlung, in einer eigenen Zeile: 33050 an 5880 mit V20.","Mit V20 teilt das Programm den Skonto: € 108,00 netto auf 5880 und € 21,60 Vorsteuer-Korrektur auf 2500.","Kundenskonto (wir geben Skonto) kommt in dieser Stufe nicht vor."]}],"checkliste_steuercodes":{"titel":"Was läuft bei Steuercodes jetzt automatisch?","punkte":[{"punkt":"Bruttobetrag wird in netto und Steuer geteilt","automatisch":true,"erklaerung":"Du gibst brutto ein. Das Programm rechnet netto = brutto : (100 + Satz) × 100."},{"punkt":"Steuerzeile auf 2500 oder 3500","automatisch":true,"erklaerung":"V-Codes buchen auf 2500 Vorsteuer, U-Codes auf 3500 Umsatzsteuer."},{"punkt":"Steuersatz 20 % oder 10 %","automatisch":true,"erklaerung":"Der Satz kommt aus dem Code: V20/U20 = 20 %, V10/U10 = 10 %."},{"punkt":"Skonto-Korrektur der Vorsteuer","automatisch":true,"erklaerung":"Skontozeile mit V20: Das Programm bucht die Vorsteuer-Korrektur auf 2500 im Haben."},{"punkt":"Storno der Steuer","automatisch":true,"erklaerung":"Das Storno nimmt denselben Steuercode. Die Steuerzeile wird mit getauschten Seiten zurückgebucht."},{"punkt":"UVA-Kennzahlen 022, 029, 060 und 095","automatisch":true,"erklaerung":"Die UVA entsteht aus den Salden von 4000, 4001, 2500 und 3500."},{"punkt":"Richtigen Steuercode wählen","automatisch":false,"erklaerung":"Das machst du. Schau auf den Steuersatz am Beleg und ob es ein Einkauf (V) oder Verkauf (U) ist."},{"punkt":"Steuerfreie Belege erkennen","automatisch":false,"erklaerung":"Das machst du: Versicherung, Bankspesen und Briefmarken haben keine USt. Steuercode leer."},{"punkt":"Periode prüfen","automatisch":false,"erklaerung":"Das machst du. Das Programm sperrt aber gesperrte Perioden."}]},"module":[{"id":"stammdaten","name":"Stammdaten","menue":"Stammdaten › Personenkonten","erklaerung":"Hier stehen unsere Kunden und Lieferanten. Jeder bekommt ein eigenes Konto, das Personenkonto.","felder":["Kontonummer (Kunden 2xxxx, Lieferanten 3xxxx)","Name mit Rechtsform","Adresse","UID-Nummer","Art (Kunde oder Lieferant)","Sammelkonto (2000 oder 3300)","Zahlungsziel in Tagen"]},{"id":"kontenplan","name":"Kontenplan","menue":"Stammdaten › Kontenplan","erklaerung":"Der Kontenplan ist die Liste aller Konten, auf die wir buchen dürfen. Jedes Konto hat eine Nummer und einen Namen.","felder":["Kontonummer","Kontobezeichnung","Kontoklasse (erste Ziffer)","Kontoart (Aktiv, Passiv, Aufwand, Ertrag)","Kontotyp (Sachkonto, Sammelkonto, Personenkonto)"]},{"id":"belegerfassung","name":"Belegerfassung (Buchungsmaske)","menue":"Buchen › Belegerfassung","erklaerung":"Hier buchst du einen Beleg. Jede Zeile hat Konto (Soll), Gegenkonto (Haben), Betrag und Steuercode. Mit Steuercode bucht das Programm die Steuerzeile automatisch.","felder":["Belegsymbol","Belegnummer","Belegdatum","Buchungsperiode","Konto (Soll)","Gegenkonto (Haben)","Text","Betrag","Brutto/Netto","Steuercode","Steuersatz","Steuerzeile (automatisch)","OP-Nummer"]},{"id":"journal","name":"Journal","menue":"Auswertungen › Journal","erklaerung":"Das Journal zeigt alle Buchungen der Reihe nach. Hier findest du jede Buchung wieder.","felder":["Buchungsnummer","Datum","Beleg","Text","Soll-Konto","Haben-Konto","Betrag","Steuercode","automatisch (Steuerzeile vom Programm)","Periode"]},{"id":"saldenliste","name":"Summen- und Saldenliste","menue":"Auswertungen › Saldenliste","erklaerung":"Die Saldenliste zeigt für jedes Konto alle Soll-Beträge und alle Haben-Beträge zusammen. Der Saldo ist der Unterschied.","felder":["Konto","Bezeichnung","Soll-Summe","Haben-Summe","Saldo","Saldo-Seite (S oder H)"]},{"id":"uva","name":"USt-Voranmeldung (UVA)","menue":"Auswertungen › USt-Voranmeldung","erklaerung":"Jeden Monat melden wir dem Finanzamt Umsatzsteuer und Vorsteuer. Es gilt: Umsatzsteuer-Zahllast = Umsatzsteuer − Vorsteuer.","felder":["Zeitraum (Monat)","Kennzahl (KZ)","Bemessungsgrundlage (netto)","Umsatzsteuer","Vorsteuer","Zahllast oder Gutschrift"]},{"id":"offene_posten","name":"Offene Posten","menue":"Auswertungen › Offene Posten","erklaerung":"Ein offener Posten ist eine Rechnung, die noch nicht bezahlt ist. Hier siehst du, was Kunden uns schulden und was wir Lieferanten schulden.","felder":["Personenkonto","Name","OP-Nummer (Rechnungsnummer)","Rechnung (Beleg)","Rechnungsdatum","Betrag","Bezahlt","Offen","Status (offen oder ausgeglichen)"]}],"aufbau_tour":[{"schritt":1,"modul":"stammdaten","text":"Zuerst die Stammdaten: Wer sind unsere Kunden und Lieferanten? Jeder hat ein eigenes Personenkonto."},{"schritt":2,"modul":"kontenplan","text":"Dann der Kontenplan: Auf diese Konten dürfen wir buchen. Die erste Ziffer ist die Kontoklasse."},{"schritt":3,"modul":"belegerfassung","text":"Jetzt buchen wir einen Beleg in der Buchungsmaske: Konto (Soll), Gegenkonto (Haben), Bruttobetrag und Steuercode. Die Steuerzeile bucht das Programm automatisch."},{"schritt":4,"modul":"journal","text":"Im Journal sehen wir die neue Buchung: die Netto-Zeile und die Steuerzeile mit „automatisch“. Alle Buchungen stehen hier der Reihe nach."},{"schritt":5,"modul":"saldenliste","text":"Zum Schluss die Auswertungen: Saldenliste, Offene Posten und USt-Voranmeldung. Sie entstehen automatisch aus den Buchungen."}],"begriffe":{"Beleg":"Ein Papier oder eine Datei, die einen Geschäftsfall beweist, z. B. eine Rechnung oder ein Kontoauszug.","Soll":"Die linke Seite eines Kontos. Frage: Wohin geht der Wert?","Haben":"Die rechte Seite eines Kontos. Frage: Woher kommt der Wert?","Buchungssatz":"Die Anweisung, auf welchen Konten gebucht wird: Soll-Konto an Haben-Konto, mit Betrag.","Netto":"Der Betrag ohne Umsatzsteuer.","Brutto":"Der Betrag mit Umsatzsteuer. Brutto = netto + Umsatzsteuer.","Umsatzsteuer (USt)":"Die Steuer auf unsere Verkäufe. Wir kassieren sie vom Kunden und schulden sie dem Finanzamt.","Vorsteuer (VSt)":"Die Steuer auf unsere Einkäufe. Wir zahlen sie dem Lieferanten und bekommen sie vom Finanzamt zurück.","Zahllast":"Umsatzsteuer minus Vorsteuer. Diesen Betrag zahlen wir an das Finanzamt.","Bemessungsgrundlage":"Der Nettobetrag, von dem die Steuer berechnet wird.","Steuercode":"Ein Kürzel wie V20 oder U20 in der Buchungsmaske. Es sagt dem Programm, welche Steuer es mit welchem Satz automatisch bucht.","Automatische Steuerzeile":"Die Buchungszeile auf 2500 Vorsteuer oder 3500 Umsatzsteuer, die das Programm aus dem Steuercode selbst erzeugt.","Steuerkonto":"Ein Konto für die Steuer: 2500 Vorsteuer oder 3500 Umsatzsteuer. Es wird über den Steuercode bebucht, nicht direkt.","Kennzahl (KZ)":"Die Nummer eines Feldes im Formular der USt-Voranmeldung.","Personenkonto":"Ein eigenes Konto für jeden Kunden (2xxxx) und jeden Lieferanten (3xxxx).","Sammelkonto":"Ein Konto, das die Summe aller Kundenkonten (2000) oder aller Lieferantenkonten (3300) zeigt.","Saldo":"Der Unterschied zwischen Soll-Summe und Haben-Summe eines Kontos.","Offener Posten (OP)":"Eine Rechnung, die noch nicht bezahlt ist.","Zahlungsziel":"So viele Tage hat man Zeit, eine Rechnung zu bezahlen.","Auf Ziel":"Wir zahlen nicht sofort, sondern später.","Bezugskosten":"Kosten, damit gekaufte Ware zu uns ins Lager kommt, z. B. Transport. Sie gehören zum Einkauf (5000).","Ausgangsfracht":"Kosten, damit verkaufte Ware zum Kunden kommt (7300).","UID-Nummer":"Die Umsatzsteuer-Identifikationsnummer eines Unternehmens. Sie beginnt in Österreich mit ATU.","Buchungsperiode":"Der Monat, in dem gebucht wird.","Eröffnungsbilanzkonto (EBK)":"Hilfskonto 9800. Damit werden die Anfangsbestände am Beginn eingebucht."},"hilfetexte":{"Belegsymbol":"Das Kürzel zeigt die Belegart: ER = Eingangsrechnung, AR = Ausgangsrechnung, BA = Bankauszug, KA = Kassabeleg, EB = Eröffnung.","Belegnummer":"Die Nummer zählt je Belegsymbol fortlaufend weiter: ER 1, ER 2, ER 3 …","Belegdatum":"Das ist das Datum, das auf dem Beleg steht.","Buchungsperiode":"Das ist der Monat, in dem gebucht wird, z. B. 10/2026 für Oktober 2026.","Konto (Soll)":"Hier steht das Soll-Konto. Frage dich: Wohin geht der Wert?","Gegenkonto (Haben)":"Hier steht das Haben-Konto. Frage dich: Woher kommt der Wert?","Text":"Ein kurzer Text sagt, worum es geht, z. B. „Einkauf Fernseher, RE 90421803“.","Betrag":"Der Betrag in Euro, mit zwei Kommastellen. Normal ist der Bruttobetrag vom Beleg (mit Steuer).","Brutto/Netto":"Hier stellst du ein, ob du den Bruttobetrag (mit Steuer) oder den Nettobetrag (ohne Steuer) eingibst. Das Programm rechnet den Rest aus.","Steuercode":"Der Steuercode sagt dem Programm, welche Steuer es buchen soll: V20 = 20 % Vorsteuer (Einkauf), U20 = 20 % Umsatzsteuer (Verkauf), V10/U10 und V13/U13 für 10 % und 13 %, leer = keine Steuer. Das Programm teilt den Betrag in netto und Steuer und bucht die Steuerzeile selbst. Echte Buchhaltungssoftware arbeitet genauso: Dafür gibt es den Steuercode.","Steuersatz":"Der Prozentsatz der Steuer vom Nettobetrag, meist 20 %. Er kommt aus dem Steuercode.","Steuerzeile (automatisch)":"Diese Zeile bucht das Programm aus dem Steuercode: V-Codes auf 2500 Vorsteuer, U-Codes auf 3500 Umsatzsteuer. Du tippst sie nicht selbst, sonst wäre die Steuer doppelt gebucht.","OP-Nummer":"Die Rechnungsnummer verbindet Rechnung und Zahlung. So weiß das Programm, welcher Posten bezahlt ist.","Buchungsdatum":"Der Tag, an dem wir buchen. Er kann nach dem Belegdatum liegen, z. B. wenn die Rechnung später bei uns einlangt.","Steuercode leer":"Lass den Steuercode leer, wenn am Beleg keine Umsatzsteuer steht. Dann gibt es keine Steuerzeile.","V10":"Vorsteuer 10 %, z. B. für Bücher. Das Programm bucht die Steuer auf 2500.","Skonto-Zeile":"Eigene Zeile bei der Zahlung: Lieferant an 5880 mit V20. Der Betrag ist der Skonto brutto.","Teilzahlung":"Gib die OP-Nummer der Rechnung ein und den Betrag vom Auszug. Der Posten bekommt den Status „teilweise bezahlt“.","Verwendungszweck":"Der Text am Kontoauszug. Dort steht meist die Rechnungsnummer. Sie ist die OP-Nummer.","Storno":"Bucht eine falsche Buchung mit getauschten Seiten zurück. Die falsche Buchung bleibt sichtbar.","Stornovermerk":"Der Hinweis im Journal, welche Buchungen zusammengehören: Fehlbuchung, Storno und Neubuchung.","Periode gesperrt":"In diese Periode kann niemand buchen. Wähle die offene Periode.","Kontoblatt":"Alle Buchungen auf einem Konto, mit dem Saldo nach jeder Zeile.","Meldung „Betrag passt nicht zum Kontoauszug“":"Die Summe deiner Zeilen ist anders als der Betrag am Auszug. Prüfe Teilzahlung und Skonto.","Meldung „OP-Nummer gehört nicht zum Konto“":"Die Rechnungsnummer passt nicht zum Kunden oder Lieferanten. Lies den Verwendungszweck noch einmal."},"aufgaben":[{"id":"T1-1","tag":1,"thema":"Navigation","modul":"stammdaten","frage":"In welchem Menü legst du einen neuen Lieferanten an?","antwort_typ":"text","richtige_antwort":"Stammdaten › Personenkonten › Neu","richtige_antwort_anzeige":"Stammdaten › Personenkonten › Neu","hinweis_falsch":"Lieferanten sind Personenkonten. Sie gehören zu den Stammdaten.","loesungsweg":"Stammdaten › Personenkonten › Neu. Dort öffnet sich die Maske mit Kontonummer, Name, Adresse und UID.","berechnung":{"art":"auswahl","wert":"Stammdaten › Personenkonten › Neu","pruefen":"menue"}},{"id":"T1-2","tag":1,"thema":"Stammdaten","modul":"stammdaten","frage":"Übung: Lege diese beiden Lieferanten an: Konto 33070 Rondo Ganahl Aktiengesellschaft (Rotfarbweg 5, 6820 Frastanz, UID ATU36505000), Konto 33080 CANCOM Austria AG (Wienerbergstraße 53, 1120 Wien, UID ATU46276408). Für beide gilt: Zahlungsziel 30 Tage, kein Skonto. Danach klicke „Prüfen“.","antwort_typ":"angelegt","richtige_antwort":"33070 und 33080","richtige_antwort_anzeige":"33070 Rondo Ganahl Aktiengesellschaft und 33080 CANCOM Austria AG sind angelegt.","hinweis_falsch":"Es sind noch nicht beide Lieferanten angelegt. Öffne die Stammdaten und lege 33070 und 33080 an." const anorm = s => String(s == null ? "" : s).toLowerCase().replace(/[›>»\/]/g, " ").replace(/[^a-z0-9äöüß ]/g, "").replace(/\s+/g, " ").trim();

    return ist.length === soll.length && ist.every((x, i) => x === soll[i]);

  if (a.antwort_typ === "text") {

    return w === anorm(r) || w.replace(/ /g, "") === anorm(r).replace(/ /g, "");
  }
  if (a.antwort_typ === "konto" || a.antwort_typ === "zahl") return String(wert).replace(/\D/g, "") !== "" && Number(String(wert).replace(/\D/g, "")) === Number(r);

}

/* ---------- Belegerfassung (Buchungsmaske) ---------- */
/* Steuercodes: V = Vorsteuer (2500), U = Umsatzsteuer (3500). Nur Konten aus dem Kontenplan. */
const STEUER_CODES = ["", "V20", "V13", "V10", "U20", "U13", "U10"];
function codeInfo(c) { const m = /^([VU])(\d+)$/.exec(c || ""); return m ? { art: m[1], satz: Number(m[2]), konto: m[1] === "V" ? "2500" : "3500" } : null; }
const satzFuer = c => { const i = codeInfo(c); return i ? i.satz + " %" : ""; };
const istSteuerkonto = nr => nr === "2500" || nr === "3500";
/* So rechnet die Maske: Eingabezeile mit Steuercode → Netto-Zeile + automatische Steuerzeile.
   Regel Stufe 1: Das Steuerkonto ersetzt das Erfolgskonto (Klasse 4 bis 8), die andere Seite bleibt.
   Ohne Erfolgskonto gilt die alte Regel (V: 2500 an Gegenkonto, U: Konto an 3500). */
function steuerSeiten(z, i) {
  if (istErfolg(z.soll) && !istErfolg(z.haben)) return { soll: i.konto, haben: z.haben };
  if (istErfolg(z.haben) && !istErfolg(z.soll)) return { soll: z.soll, haben: i.konto };
  return { soll: i.art === "V" ? "2500" : z.soll, haben: i.art === "V" ? z.haben : "3500" };
}
function zerlege(z, modus) {
  const c = cents(z.betrag); const i = codeInfo(z.code);
  if (!i) return [{ soll: z.soll, haben: z.haben, betrag: c / 100, code: "", auto: false }];
  const netto = modus === "netto" ? c : Math.round(c * 100 / (100 + i.satz));
  const steuer = modus === "netto" ? Math.round(netto * i.satz / 100) : c - netto;
  const s = steuerSeiten(z, i);
  return [{ soll: z.soll, haben: z.haben, betrag: netto / 100, code: z.code, auto: false },
          { soll: s.soll, haben: s.haben, betrag: steuer / 100, code: "", auto: true }];
}
function teile(z, modus) {  // { netto, steuer, brutto } in Cent
  const r = zerlege(z, modus); const n = cents(r[0].betrag), st = r[1] ? cents(r[1].betrag) : 0;
  return { netto: n, steuer: st, brutto: n + st };
}
function codeZelle(z) { return z.auto ? `<span class="tag auto" title="Diese Zeile hat das Programm aus dem Steuercode erzeugt.">automatisch</span>` : esc(z.steuercode); }
function neueZeile(b) { return { soll: "", haben: "", betrag: "", code: "", text: b ? b.text : "", op: "" }; }
const periodeStart = b => { const p = periodeVon(b.belegdatum); return PERIODEN.some(x => x.periode === p) ? p : b.buchungsperiode; };
function entwurf(b) {
  let e = ST.entwurf[b.beleg_id];
  if (!e) e = ST.entwurf[b.beleg_id] = { zeilen: [neueZeile(b)], modus: "brutto", versuche: 0, tipp: false, loesung: false, periode: periodeStart(b) };
  if (e.modus !== "netto") e.modus = "brutto";
  if (!e.periode || !PERIODEN.some(x => x.periode === e.periode)) e.periode = periodeStart(b);

/* OP-Feld: Rechnungszeile = Personenkonto auf der Rechnungsseite (Kunde im Soll, Lieferant im Haben) → Textfeld.
   Zahlungszeile = Personenkonto auf der anderen Seite → Auswahl aus den offenen Posten. Sonst kein OP-Feld. */
const istKunde = nr => PERSON[nr] ? /kunde/i.test(PERSON[nr].art) : String(nr).startsWith("2");
function opKonto(z) { return istPerson(z.soll) ? z.soll : istPerson(z.haben) ? z.haben : null; }
function opModus(z) {
  const p = opKonto(z); if (!p) return "aus";
  return (istKunde(p) ? z.soll === p : z.haben === p) ? "text" : "wahl";
}
const opNorm = s => String(s || "").replace(/\s+/g, "").toUpperCase();
function opAlle(b) { return opVorBeleg(b.beleg_id); }
function opFinde(b, nr) { for (const k of opAlle(b)) { const p = k.posten.find(x => opNorm(x.op) === opNorm(nr)); if (p) return { konto: k.konto, p }; } return null; }
function opWahlHtml(b, z, i, e) {
  const p = opKonto(z); const alle = opAlle(b);
  const gleich = alle.filter(k => istKunde(k.konto) === istKunde(p));
  gleich.sort((x, y) => (x.konto === p ? -1 : y.konto === p ? 1 : x.konto.localeCompare(y.konto)));
  const grp = gleich.map(k => { const ps = k.posten.filter(x => x.offen !== 0 || x.op === z.op); if (!ps.length) return "";
    return `<optgroup label="${esc(k.konto + " " + kname(k.konto))}">${ps.map(x => `<option value="${esc(x.op)}"${x.op === z.op ? " selected" : ""}>${esc(x.op)} · offen ${zahl(x.offen / 100)}</option>`).join("")}</optgroup>`; }).join("");
  let info = "";
  if (z.op) { const f = opFinde(b, z.op);
    if (f && f.konto !== p) info = `<span class="opinfo bad">Diese OP-Nummer gehört zu Konto ${esc(f.konto)}.</span>`;
    else if (f) { let ab = 0; e.zeilen.forEach(x => { const v = parseBetrag(x.betrag); if (x.op === z.op && opKonto(x) === p && opModus(x) === "wahl" && v > 0) ab += teile({ betrag: v, code: x.code }, e.modus).brutto; });
      const nach = f.p.offen - ab;
      info = `<span class="opinfo${nach < 0 ? " bad" : ""}" data-vorher="${f.p.offen}" data-nachher="${nach}">offen ${zahl(f.p.offen / 100)} → nach dem Buchen ${zahl(nach / 100)}${nach < 0 ? " (zu viel!)" : nach === 0 ? " (bezahlt)" : " (Rest bleibt offen)"}</span>`; } }
  return `<select id="op-${i}" data-i="${i}" data-feld="op" data-f="${i}-op" data-opmodus="wahl"><option value="">– offenen Posten wählen –</option>${grp}</select>${info}`;
}

VIEWS.belegerfassung = () => {
  const nb = naechster();
  if (!SEL || !BEL[SEL]) SEL = nb ? nb.beleg_id : UEBUNG[UEBUNG.length - 1].beleg_id;

    if (codesOk) {

    const z = ein.find(x => (x.soll === "2800" || x.haben === "2800") && !bank.some(s => s.brutto === x.brutto));

function onKey(ev) {
